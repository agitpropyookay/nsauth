<!doctype html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>nsauth</title>
		<!-- google fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
		<!-- material symbols & icons -->
		<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300&icon_names=add,signature,verified,verified_off" rel="stylesheet" />
	</head>
	<body>
		<style>
			.material-symbols-outlined {
			  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
			}
			*:not(h1, h2) {
				font-family: "IBM Plex Mono", monospace;
				font-size: 13px;
				font-style: normal;
				font-weight: 400;
				user-select: none;
			}
			.centreh {
				display: flex;
				justify-content: center;
			}
			.centrev {
				align-items: center;
				display: flex;
			}
			.serif {
				font-family: Times, "Times New Roman", Georgia, serif;
			}
			.small-important {
				opacity: 100%;
				text-decoration: underline;
			}
			hr {
				background-color: black;
				border: none;
				height: 1px;
			}
			small {
				font-size: 12px;
				opacity: 33%;
			}
			textarea {
				height: 128px;
				width: 512px;
				word-break: break-all;
			}
		</style>
		<h1 class="centreh serif" style="font-family:default; margin-bottom:0px; width:100%;">𝖓𝖘𝖆𝖚𝖙𝖍 𝖜𝖊𝖇</h1>
		<h6 class="centreh serif" style="margin-top:0px; opacity:50%; width:100%;">𝔪𝔞𝔡𝔢 𝔦𝔫 𝔢𝔫𝔤𝔩𝔞𝔫𝔡</h1>
		<hr />
		<label for="pkey-textarea">Key Pair</label>
		<br />
		<!-- keep spellcheck set to false for elements that contain sensitive information -->
		<textarea id="pkey-textarea" style="margin-top:8px;" spellcheck="false"></textarea>
		<div class="centrev" style="display:flex;">
			<button id="new-button" class="centrev">
				<span class="material-symbols-outlined">add</span>
				&nbsp;new&nbsp;
			</button>
			&nbsp;
			<small>make new key pair; do&nbsp;</small>
			<small class="small-important">not</small>
			<small>&nbsp;share.</small>
		</div>
		<hr style="opacity:33%;" />
		<label for="public-key-textarea">Public Key</label>
		<br />
		<div class="centrev">
			<textarea id="public-key-textarea" style="margin-top:8px;" spellcheck="false"></textarea>
			&nbsp;
			<pre id="drunken-bishop-pre" style="font-size:9px; line-height:1; margin:0;"></pre>
		</div>
		<hr style="opacity:33%;" />
		<div class="centrev">
			<label for="challenge-text">Challenge:</label>
			&nbsp;
			<input id="challenge-text" type="text" spellcheck="false" />
			&nbsp;
			<span id="verified-span" class="material-symbols-outlined" style="color:#089141; visibility:collapse;">verified</span>
			<span id="verified-off-span" class="material-symbols-outlined" style="color:#d31232;">verified_off</span>
		</div>
		<textarea id="challenge-textarea" style="margin-top:8px;" spellcheck="false"></textarea>
		<div class="centrev" style="display:flex;">
			<button id="sign-button" class="centrev">
				<span class="material-symbols-outlined">signature</span>
				&nbsp;sign&nbsp;
			</button>
			&nbsp;
			<small>sign challenge. &nbsp;requires a populated key pair.</small>
		</div>
		<hr />
		<footer class="centreh">
			<small>version 1.1</small>
			<hr />
			<small>report bugs to&nbsp;</small><small style="user-select:all;">github.com/agitpropyookay/nsauth/issues</small>
		</footer>
		<script>
const newButton = document.querySelector("#new-button");
const signButton = document.querySelector("#sign-button");

const pkeyTextarea = document.querySelector("#pkey-textarea");
const publicKeyTextarea = document.querySelector("#public-key-textarea");
const challengeTextarea = document.querySelector("#challenge-textarea");

const challengeText = document.querySelector("#challenge-text");

const verifiedSpan = document.querySelector("#verified-span");
const verifiedOffSpan = document.querySelector("#verified-off-span");

const drunkenBishopPre = document.querySelector("#drunken-bishop-pre");

const encoder = new TextEncoder();

/** 
 * convert ArrayBuffer to and from string.  
 * from: https://developer.chrome.com/blog/how-to-convert-arraybuffer-to-and-from-string/
 */
function ab2str(buf) {
	return String.fromCharCode.apply(null, new Uint8Array(buf));
}

function str2ab(str) {
	var buf = new ArrayBuffer(str.length);
	var bufView = new Uint8Array(buf);
	for (var i = 0; i < str.length; i++)
		bufView[i] = str.charCodeAt(i);
	return buf;
}

/**
 * convert base64url to base64.  note for natural numbers `a % b' is the same
 * as `a & (b - 1)' when `b' is a power of 2.
 * see: https://datatracker.ietf.org/doc/html/rfc4648#section-4
 */
function b64url2b64(url) {
	let b64 = url.replaceAll("-", "+").replaceAll("_", "/");
	switch (b64.length & 3) {
		case 0: // case (1) in rfc
			break;
		case 1:
			throw new Error("malformed base64url data");
		case 2: // case (2) in rfc
			b64 += "==";
			break;
		case 3: // case (3) in rfc
			b64 += "=";
	}
	return b64;
}

/**
 * convert base64 to base64url.  note for natural numbers `a % b' is the same
 * as `a & (b - 1)' when `b' is a power of 2.
 * see: https://datatracker.ietf.org/doc/html/rfc4648#section-5
 */
function b642b64url(b64) {
	const url = b64.replaceAll("+", "-").replaceAll("/", "_").replaceAll("=", "");
	if ((url.length & 3) == 1)
		throw new Error("malformed base64 data");
	return url;
}

/**
 * implement the drunken bishop algorithm.
 */
async function drunkenBishop(buf) {
	function p2xy(p) {
		return { x: p % 17, y: Math.trunc(p / 17) };
	}
	function xy2p(x, y) {
		return x + 17 * y;
	}
	const moves = {
		'M': { 0b00: -18, 0b01: -16, 0b10: +16, 0b11: +18 },
		'T': { 0b00:  -1, 0b01:  +1, 0b10: +16, 0b11: +18 },
		'B': { 0b00: -18, 0b01: -16, 0b10:  -1, 0b11:  +1 },
		'L': { 0b00: -17, 0b01: -16, 0b10: +17, 0b11: +18 },
		'R': { 0b00: -18, 0b01: -17, 0b10: +16, 0b11: +17 },
		'a': { 0b00:   0, 0b01:  +1, 0b10: +17, 0b11: +18 },
		'b': { 0b00:  -1, 0b01:   0, 0b10: +16, 0b11: +17 },
		'c': { 0b00: -17, 0b01: -16, 0b10:   0, 0b11:  +1 },
		'd': { 0b00: -18, 0b01: -17, 0b10:  -1, 0b11:   0 },
	};
	const charset = " .o+=*BOX@%&#/^";
	const sha1 = await crypto.subtle.digest("SHA-1", buf);
	const u8 = new Uint8Array(sha1);
	const width = 17;
	const height = 9;
	const coins = new Uint8Array(17 + 17 * 9);
	for (let i = 0; i < 16 + 17 * 8; ++i) {
		coins[i] = 0;
	}
	let p = xy2p(8, 4);
	coins[p] = 1;
	for (let i = 0; i < 16; ++i) {
		let byte = u8[i];
		for (let _ = 0; _ < 4; ++_) {
			let { x, y } = p2xy(p);
			let pos = 'M';
			if (x == 0)
				pos = 'L';
			if (x == 16)
				pos = 'R';
			if (y == 0)
				pos = 'T';
			if (y == 8)
				pos = 'B';
			if (x == 0 && y == 0)
				pos = 'a';
			if (x == 16 && y == 0)
				pos = 'b';
			if (x == 0 && y == 8)
				pos = 'c';
			if (x == 16 && y == 8)
				pos = 'd';
						p += moves[pos][byte & 0b11];
			++coins[p];
			byte >>= 2;
		}
	}
	const end = p2xy(p);
	let atrium = "+---[ Ed25519 ]---+\n";
	for (let y = 0; y < 9; ++y) {
		let lin = "";
		for (let x = 0; x < 17; ++x) {
			lin += x == 8 && y == 4
				? 'S'
				: x == end.x && y == end.y
					? 'E'
					: charset[Math.min(coins[xy2p(x, y)], charset.length - 1)];
		}
		atrium += `|${lin}|\n`;
	}
	atrium += "+-----------------+";
	drunkenBishopPre.innerText = atrium;
}

/** generate a new key.  */
newButton.addEventListener("click", async () => {
	const pkey = (await crypto.subtle.generateKey("Ed25519", true, ["sign", "verify"])).privateKey;
	const exported = await crypto.subtle.exportKey("jwk", pkey);
	pkeyTextarea.value = window.btoa(ab2str(encoder.encode(JSON.stringify(exported))));
	pkeyTextarea.dispatchEvent(new Event("input")); // populate public key
	challengeTextarea.dispatchEvent(new Event("input")); // verify signature
});

/** generate a digital signature.  */
signButton.addEventListener("click", async () => {
	const jwk = JSON.parse(atob(pkeyTextarea.value));
	const pkey = await crypto.subtle.importKey("jwk", jwk, { name: "Ed25519", namedCurve: "Ed25519" }, false, ["sign"]);
	const data = encoder.encode(challengeText.value);
	const sig = await crypto.subtle.sign("Ed25519", pkey, data);
	challengeTextarea.value = btoa(ab2str(sig));
	challengeTextarea.dispatchEvent(new Event("input")); // verify signature
});

/** extract public key from key pair.  */
pkeyTextarea.addEventListener("input", async () => {
	publicKeyTextarea.value = b64url2b64(JSON.parse(atob(pkeyTextarea.value)).x);
	drunkenBishop(str2ab(atob(publicKeyTextarea.value)));
});

/** fire event to verify signature.  */
publicKeyTextarea.addEventListener("input", async () => {
	drunkenBishop(str2ab(atob(publicKeyTextarea.value)));
	challengeTextarea.dispatchEvent(new Event("input")); // verify signature
});

/** fire event to verify signature.  */
challengeText.addEventListener("input", async () => {
	challengeTextarea.dispatchEvent(new Event("input")); // verify signature
});

/** verify signature.  */
challengeTextarea.addEventListener("input", async () => {
	verifiedSpan.style.visibility = "collapse";
	verifiedOffSpan.style.visibility = "visible";
	const x = b642b64url(publicKeyTextarea.value);
	const sig = str2ab(atob(challengeTextarea.value));
	const data = encoder.encode(challengeText.value);
	const jwk = { crv: "Ed25519", ext: true, kty: "OKP", x: x };
	const key = await crypto.subtle.importKey("jwk", jwk, { name: "Ed25519" }, false, ["verify"]);
	const result = await crypto.subtle.verify({ name: "Ed25519" }, key, sig, data);
	if (result) {
		verifiedSpan.style.visibility = "visible";
		verifiedOffSpan.style.visibility = "collapse";
	}
});
		</script>
	<body>
</html>
